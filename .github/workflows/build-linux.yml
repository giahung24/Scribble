name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # ffmpeg removed from this list (v1.2.11+): the sidecar bundles a
        # static ffmpeg binary via imageio-ffmpeg's wheel, so the runner
        # doesn't need its own. See src-python/services/audio.py find_ffmpeg().
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        working-directory: src-python
        run: uv pip install --system -r requirements.txt

      - name: Download ONNX model
        working-directory: src-python/models
        run: |
          if [ ! -f voxceleb_CAM++.onnx ]; then
            curl -L -o voxceleb_CAM++.onnx "https://wespeaker-1256283475.cos.ap-shanghai.myqcloud.com/models/voxceleb/voxceleb_CAM++.onnx"
          fi

      - name: Build sidecar
        working-directory: src-python
        run: python -m PyInstaller scribble-sidecar.spec --noconfirm --clean

      - name: Copy sidecar + compress
        run: |
          mkdir -p src-tauri/binaries
          # Strip unnecessary files
          rm -rf src-python/dist/scribble-sidecar/_internal/grpc_tools 2>/dev/null || true
          find src-python/dist/scribble-sidecar/_internal -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find src-python/dist/scribble-sidecar/_internal -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find src-python/dist/scribble-sidecar/_internal -name "*.dist-info" -type d -exec rm -rf {} + 2>/dev/null || true
          # Compress
          tar --zstd -cf src-tauri/binaries/sidecar-dist.tar.zst -C src-python/dist scribble-sidecar
          # Create launcher shim
          cat > src-tauri/binaries/scribble-sidecar-x86_64-unknown-linux-gnu << 'SHEOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          for candidate in "$DIR/sidecar-dist/scribble-sidecar" "$DIR/../Resources/sidecar-dist/scribble-sidecar"; do
              if [ -x "$candidate" ]; then exec "$candidate" "$@"; fi
          done
          exit 1
          SHEOF
          chmod +x src-tauri/binaries/scribble-sidecar-x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri
        # Signing env vars trigger `.sig` generation for the AppImage. Updater
        # uses AppImage on Linux (deb has no manifest entry). If secret unset,
        # build still works but produces no signature → auto-update offline.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Resolve version
        id: version
        # Tag pushes (v1.2.3) → strip the leading "v". Branch / manual runs have
        # no version in the ref, so fall back to package.json — otherwise VERSION
        # becomes the branch name and the upload filename gets a "/" in it. Matches build.yml.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        # First of the 3 parallel platform builds wins the race + creates the
        # draft; the rest no-op. See build.yml for the rationale.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Auto-created by CI. Update notes before publishing." || \
            true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          APPIMAGE=$(find src-tauri/target -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            FILENAME="Scribble_${VERSION}_amd64.AppImage"
            cp "$APPIMAGE" "$FILENAME"
            gh release upload "$TAG" "$FILENAME" --clobber
            echo "✅ Uploaded: $FILENAME"
            # Tauri emits AppImage.sig next to AppImage when signing key is set.
            # If absent (secret not configured), skip — manifest job will
            # detect missing signature and omit Linux from the manifest.
            APPIMAGE_SIG="${APPIMAGE}.sig"
            if [ -f "$APPIMAGE_SIG" ]; then
              cp "$APPIMAGE_SIG" "${FILENAME}.sig"
              gh release upload "$TAG" "${FILENAME}.sig" --clobber
              echo "✅ Uploaded: ${FILENAME}.sig"
            else
              echo "⚠️  No signature for AppImage — Linux auto-update disabled"
            fi
          fi

          DEB=$(find src-tauri/target -name "*.deb" | head -1)
          if [ -n "$DEB" ]; then
            FILENAME="scribble_${VERSION}_amd64.deb"
            cp "$DEB" "$FILENAME"
            gh release upload "$TAG" "$FILENAME" --clobber
            echo "✅ Uploaded: $FILENAME"
          fi

          if [ -z "$APPIMAGE" ] && [ -z "$DEB" ]; then
            echo "❌ No Linux bundle found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as artifact (manual run)
        # On branch / manual (workflow_dispatch) runs there's no release to push
        # to, so expose the bundle on the Actions run page instead. Mirrors build.yml.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: scribble-linux-amd64
          path: |
            src-tauri/target/**/*.AppImage
            src-tauri/target/**/*.AppImage.sig
            src-tauri/target/**/*.deb
          retention-days: 30
          if-no-files-found: warn
